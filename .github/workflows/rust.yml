name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  YT_API_KEY: ${{ secrets.YT_API_KEY }}
  TWITCH_SECRET: ${{ secrets.TWITCH_SECRET }}
  TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_yt: ${{ steps.check.outputs.has_yt }}
      has_twitch: ${{ steps.check.outputs.has_twitch }}
      has_any: ${{ steps.check.outputs.has_any }}
    steps:
      - id: check
        shell: bash
        run: |
          has_yt=false
          has_twitch=false

          if [ -n "${{ secrets.YT_API_KEY }}" ]; then has_yt=true; fi
          if [ -n "${{ secrets.TWITCH_CLIENT_ID }}" ] && [ -n "${{ secrets.TWITCH_SECRET }}" ]; then has_twitch=true; fi

          if [ "$has_yt" = "true" ] || [ "$has_twitch" = "true" ]; then
            has_any=true
          else
            has_any=false
          fi

          echo "has_yt=$has_yt" >> "$GITHUB_OUTPUT"
          echo "has_twitch=$has_twitch" >> "$GITHUB_OUTPUT"
          echo "has_any=$has_any" >> "$GITHUB_OUTPUT"

  build-and-test:
    runs-on: ubuntu-latest
    needs: [check-secrets]

    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server ffmpeg python3-pip

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -U yt-dlp
          yt-dlp --version

      - name: Start Redis
        run: |
          redis-server --daemonize yes
          redis-cli ping

      - name: Build
        run: cargo build --verbose

      # If ANY secrets exist, run full suite. If you want to only run full suite when YT is present,
      # change the condition to needs.check-secrets.outputs.has_yt == 'true'
      - name: Run tests (with secrets)
        if: needs.check-secrets.outputs.has_any == 'true'
        run: cargo test --verbose

      - name: Run tests (no secrets)
        if: needs.check-secrets.outputs.has_any != 'true'
        run: cargo test --verbose -- --skip requires_api_key
