version: 2
updates:
  # Rust crates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

    # Optional: group updates so you don’t get spammed with PRs
    groups:
      rust-dependencies:
        patterns:
          - "*"

    # Optional safety: avoid auto major bumps on the HTTP stack
    ignore:
      - dependency-name: "actix-web"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actix-http"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hyper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "reqwest"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Python (only if you actually have requirements.txt / pyproject.toml etc.)
  # If you don’t, delete this block to avoid noise.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
