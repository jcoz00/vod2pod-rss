version: 2

updates:
  # Rust crates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "actix-web"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "actix-http"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "hyper"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "reqwest"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "cached"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "redis"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # yt-dlp
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10