version: 2
updates:
  # -----------------------
  # Rust / Cargo (including Cargo.lock)
  # -----------------------
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    groups:
      rust-dependencies:
        patterns:
          - "*"
    # Optional: reduce risk of "MSRV surprise" changes by ignoring major bumps
    # for a few high-churn crates. Uncomment if you want slower change.
    # ignore:
    #   - dependency-name: "actix-web"
    #     update-types: ["version-update:semver-major"]
    #   - dependency-name: "actix-http"
    #     update-types: ["version-update:semver-major"]
    #   - dependency-name: "time"
    #     update-types: ["version-update:semver-major"]

  # -----------------------
  # Python / pip
  # -----------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:10"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # -----------------------
  # GitHub Actions
  # -----------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
