[package]
authors = ["jcoz00"]
edition = "2024"
name = "vod2pod-rss"
version = "1.2.5"
rust-version = "1.93"

[lib]
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
google-youtube3 = { version = "=7.0.0", features = ["yup-oauth2"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
# only what YOU directly use
bytes = "1"
http-body-util = "0.1"
hyper-util = "=0.1.20"

actix-rt = "=2.12.0"
actix-web = "=4.14.1"
async-trait = "=0.1.92"
url = { version="=2.5.8", features = ["serde"]}
futures = "=0.3.34"
log = "=0.4.33"
regex = "=1.13.1"
reqwest = { version = "=0.13.4", features = ["json", "form"] }
serde = "=1.0.229"
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "process"]}
uuid = { version= "=1.24.1", features = ["v4", "serde"]}
genawaiter = {version = "=0.99", features = ["futures03"] }
openssl = { version = "*", features = ["vendored"] }
rss = { version = "=2.1", features = ["serde"] }
eyre = "=0.6"
simple_logger = "=5.2"
redis = { version = "=0.32.7", features = ["tokio-comp"] }
mime = "=0.3.17"
cached = { version = "=0.56.0", features = ["redis_tokio"] }
iso8601-duration = "=0.2.0"
chrono = "=0.4.45"
feed-rs = "=2.4.0"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.11.0"
hex = "0.4.3"
urlencoding = "2.1.3"

[dev-dependencies]
temp-env ={ version = "=0.3.6", features = ["async_closure"] }
env_logger = "*"
test-log = "0.2.11"
