[package]
authors = ["jcoz00"]
edition = "2024"
name = "vod2pod-rss"
version = "1.2.5"
rust-version = "1.93"

[lib]
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
google-youtube3 = { version = "=7.0.0", features = ["yup-oauth2"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
# only what YOU directly use
bytes = "1"
http-body-util = "0.1"
hyper-util = "=0.1.17"

actix-rt = "=2.11.0"
actix-web = "=4.13.0"
async-trait = "=0.1.89"
url = { version="=2.5.8", features = ["serde"]}
futures = "=0.3.32"
log = "=0.4.29"
regex = "=1.12.3"
reqwest = { version = "=0.13.2", features = ["json", "form"] }
serde = "=1.0.228"
serde_json = "=1.0.149"
tokio = { version = "=1.49.0", features = ["macros", "process"]}
uuid = { version= "=1.21.0", features = ["v4", "serde"]}
genawaiter = {version = "=0.99", features = ["futures03"] }
openssl = { version = "*", features = ["vendored"] }
rss = { version = "=2.0", features = ["serde"] }
eyre = "=0.6"
simple_logger = "=5.2"
redis = { version = "0.32.7", features = ["tokio-comp"] }
mime = "=0.3.17"
cached = { version = "=0.56.0", features = ["redis_tokio"] }
iso8601-duration = "=0.2.0"
chrono = "=0.4.44"
feed-rs = "=2.3.1"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.10.9"
hex = "0.4.3"
urlencoding = "2.1.3"

[dev-dependencies]
temp-env ={ version = "=0.3.6", features = ["async_closure"] }
env_logger = "*"
test-log = "0.2.11"
